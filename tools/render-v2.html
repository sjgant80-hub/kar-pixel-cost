<!doctype html>
<html><head><meta charset="utf-8"><title>kar-pixel-cost · v2 renderer</title></head>
<body style="margin:0;background:#fff">
<canvas id="c"></canvas>
<script type="module">
// The v2 renderer: the same plain monospace, black-on-white canvas as v1 (16px, 640px wide, 12px padding), with the
// line breaking taken from the gated kernel (wrapLines) — so the kernel predicts this page's pixel size exactly.
import { wrapLines, imageSize } from '../kernel.mjs';
const FONT_PX = 16, MAX_W = 640, PAD = 12;
window.__metrics = () => {
  const cx = document.getElementById('c').getContext('2d');
  cx.font = FONT_PX + 'px monospace';
  return { charWidthPx: cx.measureText('M').width, fontPx: FONT_PX, maxWidthPx: MAX_W, pad: PAD };
};
window.__render2 = (text) => {
  const m = window.__metrics();
  const size = imageSize(text, m);
  if (!size.ok) return size;
  const lines = wrapLines(text, size.charsPerLine).lines;
  const cv = document.getElementById('c'), cx = cv.getContext('2d');
  cv.width = size.width; cv.height = size.height;
  cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height);
  cx.font = FONT_PX + 'px monospace'; cx.fillStyle = '#000'; cx.textBaseline = 'top';
  lines.forEach((line, i) => cx.fillText(line, PAD, PAD + i * size.linePx));
  return { ok: true, width: cv.width, height: cv.height, lines: lines.length, charsPerLine: size.charsPerLine, metrics: m, dataUrl: cv.toDataURL('image/png') };
};
window.__ready = true;
</script>
</body></html>

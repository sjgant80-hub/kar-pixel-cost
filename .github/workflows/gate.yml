name: proof-of-play
on: [push, pull_request, workflow_dispatch]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node --test kernel.test.mjs
      # Pinned. An unpinned gate is a gate somebody else can change.
      - name: witness — the pure layout math re-proves itself, forever
        run: |
          git clone --depth 1 --branch v0.6 https://github.com/sjgant80-hub/witness.git /tmp/witness
          node /tmp/witness/witness.mjs mutate kernel.mjs --timeout 60000 --cap 400 --test node --test kernel.test.mjs | tee verdict.txt
          grep -q '"clean": true' verdict.txt || { echo "::error::mutants survived — the gate is not clean"; exit 1; }
      - name: page fixpoint — the live page IS the gated kernel AND the real findings
        run: |
          node tools/make-page.mjs
          git diff --exit-code index.html README.md llms.txt
      - name: the read-back seal — the pre-registration is exactly what the committed inputs give
        run: node tools/seal-readback.mjs --check
      - name: the basis — no untraced price, and this repository's own current compliance map
        run: |
          git clone --quiet https://github.com/sjgant80-hub/fallstack /tmp/fallstack && git -C /tmp/fallstack checkout --quiet 4eeb828
          git clone --quiet https://github.com/sjgant80-hub/fall-euaiact /tmp/fall-euaiact && git -C /tmp/fall-euaiact checkout --quiet d522314
          node /tmp/fallstack/tools/price-check.mjs .
          node /tmp/fall-euaiact/tools/comply-build.mjs . --check
      - name: the bell — hear the verdict
        if: always()
        run: |
          echo "### the verdict, ready to ring — paste it at the-bell" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          tail -c 2000 verdict.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo '{"note":"gate did not reach the witness step"}' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
